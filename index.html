<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Earth</title>
<style>
  :root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; background: #02030a; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #ui { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; gap: 10px; justify-content: center; align-items: center; color: #cfd8ff; font-size: 13px; }
  button { background: rgba(255,255,255,.1); color: #e8ecff; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.2); }
  #hint { opacity: .6; }
  #info { position: fixed; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px); max-width: 260px; padding: 12px 14px; border-radius: 12px; background: rgba(8,14,40,.72); border: 1px solid rgba(255,255,255,.18); color: #e8ecff; font-size: 13px; line-height: 1.45; backdrop-filter: blur(6px); pointer-events: none; }
  #info b { display: block; font-size: 16px; margin-bottom: 2px; }
  #info small { opacity: .7; }
</style>
</head>
<body>
<div id="info"><b>Click anywhere on Earth</b><small>Pick a spot to see its coordinates and nearest city.</small></div>
<div id="ui"><button id="spin">Pause rotation</button><span id="hint">Drag to rotate · scroll to zoom · click a place</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Procedural Earth texture ----------
const W = 2048, H = 1024;
const X = lon => (lon + 180) / 360 * W, Y = lat => (90 - lat) / 180 * H;
const land = [
  [[-168,66],[-156,71],[-125,70],[-95,72],[-80,73],[-62,60],[-55,52],[-67,45],[-76,38],[-81,31],[-80,25],[-84,30],[-90,29],[-97,26],[-97,20],[-91,18],[-87,21],[-88,16],[-83,10],[-78,8],[-86,12],[-92,15],[-105,20],[-110,23],[-114,31],[-117,33],[-124,40],[-124,48],[-135,58],[-150,60],[-165,60],[-166,64]],
  [[-78,8],[-72,12],[-62,10],[-52,5],[-50,0],[-35,-5],[-39,-15],[-48,-26],[-58,-38],[-65,-42],[-68,-52],[-72,-54],[-75,-46],[-73,-37],[-71,-20],[-76,-14],[-81,-5],[-80,0],[-77,4]],
  [[-17,21],[-10,30],[-5,36],[10,37],[20,32],[32,31],[35,28],[43,12],[51,12],[40,-3],[40,-15],[35,-25],[27,-34],[18,-34],[12,-18],[13,-8],[9,3],[-8,4],[-17,14]],
  [[-9,37],[-9,43],[-2,48],[5,52],[8,57],[5,62],[15,69],[30,71],[60,69],[80,73],[110,77],[140,72],[170,70],[180,66],[160,60],[155,52],[142,53],[140,45],[130,42],[127,35],[122,40],[121,30],[110,20],[106,10],[100,13],[103,2],[98,8],[98,16],[90,22],[80,15],[77,8],[72,20],[67,25],[57,25],[56,27],[48,30],[50,26],[56,24],[60,22],[52,16],[43,13],[35,28],[34,31],[36,36],[27,37],[26,40],[22,37],[19,41],[13,45],[16,41],[8,44],[3,43],[-2,37]],
  [[114,-22],[122,-18],[130,-12],[137,-12],[142,-11],[146,-19],[153,-26],[150,-37],[141,-38],[135,-35],[129,-32],[115,-34]],
  [[-55,60],[-45,60],[-20,70],[-20,82],[-60,82],[-72,77]],
  [[-6,50],[2,52],[-3,58],[-6,56]],
  [[130,31],[135,34],[141,38],[142,45],[140,41],[133,35]],
  [[95,5],[106,-6],[104,-3],[98,2]],[[106,-6],[115,-8],[110,-7]],[[109,1],[118,7],[118,-3],[110,-3]],
  [[44,-25],[49,-15],[50,-13],[44,-17]],[[166,-46],[174,-41],[178,-38],[172,-35],[168,-44]]
];
const tex = document.createElement('canvas'); tex.width = W; tex.height = H;
const c = tex.getContext('2d');
let g = c.createLinearGradient(0, 0, 0, H);
g.addColorStop(0, '#0b3d7a'); g.addColorStop(.5, '#0a5aa8'); g.addColorStop(1, '#0b3d7a');
c.fillStyle = g; c.fillRect(0, 0, W, H);
function poly(p, fill) {
  c.beginPath(); p.forEach(([lo, la], i) => i ? c.lineTo(X(lo), Y(la)) : c.moveTo(X(lo), Y(la))); c.closePath();
  c.fillStyle = fill; c.fill();
}
c.lineJoin = 'round';
land.forEach(p => { poly(p, '#2e7d3a'); c.strokeStyle = '#6fae5a'; c.lineWidth = 3; c.stroke(); });
// deserts / highlands tint
[[[-17,15],[30,15],[35,28],[10,32],[-10,28]], [[40,20],[55,26],[50,32],[38,30]], [[120,38],[105,42],[95,40],[110,36]], [[120,-23],[140,-24],[135,-30],[122,-30]], [[-115,32],[-105,28],[-108,40],[-118,38]]]
  .forEach(p => { c.globalAlpha = .55; poly(p, '#c9a45c'); c.globalAlpha = 1; });
// polar ice
c.fillStyle = '#eef6ff'; c.fillRect(0, Y(-70), W, H - Y(-70)); c.fillRect(0, 0, W, Y(86));
poly(land[5], '#f4f9ff');
// speckle texture
for (let i = 0; i < 9000; i++) {
  c.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},${Math.random() * .05})`;
  c.fillRect(Math.random() * W, Math.random() * H, 3 + Math.random() * 6, 3 + Math.random() * 6);
}
// clouds texture
const cl = document.createElement('canvas'); cl.width = W; cl.height = H;
const cc = cl.getContext('2d'); cc.filter = 'blur(10px)';
for (let i = 0; i < 260; i++) {
  cc.fillStyle = `rgba(255,255,255,${.12 + Math.random() * .25})`;
  const x = Math.random() * W, y = H * (.12 + Math.random() * .76);
  cc.beginPath(); cc.ellipse(x, y, 30 + Math.random() * 90, 8 + Math.random() * 22, Math.random() * .6 - .3, 0, 7); cc.fill();
}

// ---------- Scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, .1, 100);
camera.position.z = 3.2;

const earth = new THREE.Group(); scene.add(earth);
const earthMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1, 96, 96),
  new THREE.MeshPhongMaterial({ map: new THREE.CanvasTexture(tex), shininess: 18, specular: new THREE.Color(0x222a44) })
);
earth.add(earthMesh);
const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(1.012, 64, 64),
  new THREE.MeshPhongMaterial({ map: new THREE.CanvasTexture(cl), transparent: true, depthWrite: false })
);
earth.add(clouds);

// atmosphere glow
const atmo = new THREE.Mesh(
  new THREE.SphereGeometry(1.14, 64, 64),
  new THREE.ShaderMaterial({
    transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false,
    vertexShader: 'varying vec3 n; void main(){ n = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'varying vec3 n; void main(){ float i = pow(0.62 - dot(n, vec3(0.,0.,1.)), 3.0); gl_FragColor = vec4(0.3,0.6,1.0,1.0) * i * 1.6; }'
  })
);
scene.add(atmo);

// lights + stars
const sun = new THREE.DirectionalLight(0xfff3dd, 1.5); sun.position.set(5, 2, 4); scene.add(sun);
scene.add(new THREE.AmbientLight(0x223355, .55));
const sp = [];
for (let i = 0; i < 1800; i++) {
  const v = new THREE.Vector3().randomDirection ? new THREE.Vector3().randomDirection() : new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize();
  sp.push(v.x * 40, v.y * 40, v.z * 40);
}
const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: .08, sizeAttenuation: true })));

earth.rotation.z = 23.4 * Math.PI / 180;
earthMesh.rotation.y = -1.6; clouds.rotation.y = -1.6;

// ---------- Interaction ----------
let auto = true, dragging = false, px = 0, py = 0, vy = 0, tilt = 0.25;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointerup', () => dragging = false);
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
  vy = dx * .005; earthMesh.rotation.y += vy; clouds.rotation.y += vy;
  tilt = Math.max(-1.2, Math.min(1.2, tilt + dy * .004));
});
el.addEventListener('wheel', e => { e.preventDefault(); camera.position.z = Math.max(1.6, Math.min(7, camera.position.z + e.deltaY * .002)); }, { passive: false });
document.getElementById('spin').onclick = e => { auto = !auto; e.target.textContent = auto ? 'Pause rotation' : 'Resume rotation'; };

// ---------- Clickable places ----------
const cities = [['New York',40.71,-74.01],['Los Angeles',34.05,-118.24],['Mexico City',19.43,-99.13],['Toronto',43.65,-79.38],['São Paulo',-23.55,-46.63],['Buenos Aires',-34.6,-58.38],['Lima',-12.05,-77.04],['Bogotá',4.71,-74.07],['London',51.51,-0.13],['Paris',48.86,2.35],['Madrid',40.42,-3.7],['Rome',41.9,12.5],['Moscow',55.76,37.62],['Cairo',30.04,31.24],['Lagos',6.52,3.38],['Nairobi',-1.29,36.82],['Cape Town',-33.92,18.42],['Istanbul',41.01,28.98],['Dubai',25.2,55.27],['Mumbai',19.08,72.88],['Delhi',28.61,77.21],['Bangkok',13.76,100.5],['Singapore',1.35,103.82],['Beijing',39.9,116.4],['Shanghai',31.23,121.47],['Seoul',37.57,126.98],['Tokyo',35.68,139.69],['Jakarta',-6.2,106.85],['Sydney',-33.87,151.21],['Brisbane',-27.47,153.03],['Perth',-31.95,115.86],['Auckland',-36.85,174.76],['Reykjavík',64.15,-21.94],['Anchorage',61.22,-149.9]];
function ll2v(lat, lon, r) {
  const ph = (lon + 180) * Math.PI / 180, th = (90 - lat) * Math.PI / 180;
  return new THREE.Vector3(-r * Math.sin(th) * Math.cos(ph), r * Math.cos(th), r * Math.sin(th) * Math.sin(ph));
}
function km(a, b, c2, d) {
  const R = Math.PI / 180, h = Math.sin((c2 - a) * R / 2) ** 2 + Math.cos(a * R) * Math.cos(c2 * R) * Math.sin((d - b) * R / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
const pinMat = new THREE.MeshBasicMaterial({ color: 0xffd45e });
cities.forEach(([n, la, lo]) => { const m = new THREE.Mesh(new THREE.SphereGeometry(.009, 10, 10), pinMat); m.position.copy(ll2v(la, lo, 1.003)); earthMesh.add(m); });
const marker = new THREE.Mesh(new THREE.SphereGeometry(.016, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff4d4d }));
const ring = new THREE.Mesh(new THREE.RingGeometry(.03, .036, 40), new THREE.MeshBasicMaterial({ color: 0xff4d4d, side: THREE.DoubleSide, transparent: true }));
marker.visible = false; ring.visible = false; earthMesh.add(marker); earthMesh.add(ring);
const info = document.getElementById('info');
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let sx = 0, sy = 0, pulse = 0;
el.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
el.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - sx, e.clientY - sy) > 5) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(earthMesh)[0];
  if (!hit) return;
  const lon = hit.uv.x * 360 - 180, lat = hit.uv.y * 180 - 90;
  const p = c.getImageData(Math.min(W - 1, hit.uv.x * W | 0), Math.min(H - 1, (1 - hit.uv.y) * H | 0), 1, 1).data;
  const kind = (p[0] > 215 && p[1] > 215 && p[2] > 215) ? 'Polar ice' : (p[2] > p[1] && p[2] > p[0]) ? 'Ocean' : 'Land';
  let best = null, bd = 1e9;
  cities.forEach(ct => { const d = km(lat, lon, ct[1], ct[2]); if (d < bd) { bd = d; best = ct; } });
  const pos = ll2v(lat, lon, 1.004);
  marker.position.copy(pos); ring.position.copy(pos); ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), pos.clone().normalize());
  marker.visible = ring.visible = true; pulse = 0;
  const ns = lat >= 0 ? 'N' : 'S', ew = lon >= 0 ? 'E' : 'W';
  const title = bd < 150 ? best[0] : kind;
  const near = bd < 150 ? 'Within ' + Math.round(bd) + ' km of the city pin' : 'Nearest city: ' + best[0] + ' (~' + Math.round(bd).toLocaleString() + ' km)';
  info.innerHTML = '<b>' + title + '</b>' + Math.abs(lat).toFixed(2) + '° ' + ns + ', ' + Math.abs(lon).toFixed(2) + '° ' + ew + '<br><small>' + kind + ' · ' + near + '</small>';
});

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

(function loop() {
  requestAnimationFrame(loop);
  if (auto && !dragging) { earthMesh.rotation.y += .0018; }
  clouds.rotation.y += (auto && !dragging ? .0023 : 0);
  earth.rotation.x += (tilt - earth.rotation.x) * .1;
  if (ring.visible) { pulse = (pulse + .02) % 1; ring.scale.setScalar(1 + pulse * 1.8); ring.material.opacity = 1 - pulse; }
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
